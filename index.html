<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <!-- Fondamentale per la resa responsive su mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario Responsive</title>
  <style>
    /* RESET E STILI BASE */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      padding: 20px;
      background-color: #f4f6f8;
    }

    .calendar-container {
      max-width: 1000px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    /* INTESTAZIONE GIORNI (DESKTOP) */
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: bold;
      background: #007bff;
      color: #fff;
      padding: 10px 0;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    /* GRIGLIA DESKTOP (7 colonne) */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .day-card {
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 8px;
      min-height: 100px;
      display: flex;
      flex-direction: column;
    }

    .day-number {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
      color: #555;
    }

    .event {
      background-color: #e3f2fd;
      color: #0d47a1;
      padding: 4px 6px;
      border-radius: 3px;
      font-size: 12px;
      margin-top: 4px;
      border-left: 3px solid #1976d2;
    }

    /* Giorni vuoti per pareggiare l'inizio del mese */
    .day-card.empty {
      background: transparent;
      border: none;
    }

    /* ===================================================
       STILI RESPONSIVE PER SMARTPHONE (Sotto i 768px)
       =================================================== */
    @media (max-width: 767px) {
      /* Nasconde l'intestazione rigida dei giorni */
      .weekdays {
        display: none;
      }

      /* Trasforma la griglia in una lista singola a scorrimento verticale */
      .calendar-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      /* Nasconde le celle vuote del calendario */
      .day-card.empty {
        display: none;
      }

      /* Riorganizza le schede giorno per il mobile */
      .day-card {
        min-height: auto;
        padding: 12px;
        background: #ffffff;
        border-left: 4px solid #007bff; /* Evidenzia il giorno */
      }

      .day-number {
        font-size: 16px;
        color: #007bff;
      }

      /* Garantisce la massima leggibilità del testo dell'evento */
      .event {
        font-size: 14px;
        line-height: 1.4;
        white-space: normal;
        word-break: break-word;
        padding: 8px;
        margin-top: 6px;
      }
    }
  </style>
</head>
<body>

  <div class="calendar-container">
    <h2>Ottobre 2026</h2>

    <!-- Intestazione giorni della settimana -->
    <div class="weekdays">
      <div>Lun</div>
      <div>Mar</div>
      <div>Mer</div>
      <div>Gio</div>
      <div>Ven</div>
      <div>Sab</div>
      <div>Dom</div>
    </div>

    <!-- Griglia del Calendario -->
    <div class="calendar-grid">
      <!-- Cella vuota per allineamento inizio mese -->
      <div class="day-card empty"></div>
      <div class="day-card empty"></div>

      <!-- Giorni con eventi -->
      <div class="day-card">
        <span class="day-number">1</span>
        <div class="event">Riunione di progetto ore 10:00</div>
      </div>

      <div class="day-card">
        <span class="day-number">2</span>
      </div>

      <div class="day-card">
        <span class="day-number">3</span>
        <div class="event">Consegna documentazione e verifica requisiti tecnici</div>
      </div>

      <div class="day-card">
        <span class="day-number">4</span>
      </div>

      <div class="day-card">
        <span class="day-number">5</span>
        <div class="event">Call con il cliente</div>
        <div class="event">Appuntamento dal dentista</div>
      </div>

      <!-- Aggiungi qui gli altri giorni del mese -->
    </div>
  </div>

</body>
</html>
